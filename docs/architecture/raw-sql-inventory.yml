# Raw-SQL inventory -- the authoritative register of production raw SQL.
#
# WHY THIS FILE EXISTS
# --------------------
# apps/api/core/tenancy.py auto-filters every ORM query by workspace. Raw SQL bypasses that
# filter completely, so for these statements THIS INVENTORY IS THE CONTROL. It previously
# lived as a prose table in mysql-migration-phase0.md that claimed "9 sites" while the tree
# actually held 26 -- silent drift, exactly as that document predicted it would.
#
# `scripts/raw_sql_inventory.py --check` discovers the real sites from the AST and compares
# them against this file. CI runs it (the `raw-sql-inventory` job). A new raw statement, or a
# registered one that moved, FAILS the build until it is reviewed and registered here.
#
# CLASSIFICATIONS
#   TENANT_SCOPED  -- touches a table in tenancy._DIRECT_TABLES/_VIA_TABLES. MUST carry its
#                     own workspace predicate, or be provably scoped by another key; the
#                     reason must say which.
#   SYSTEM_SCOPED  -- touches a tenancy.EXEMPT_TABLES table (scans, api_keys, scan_schedules).
#                     Keyed by a trusted internal id before the workspace is known.
#   GLOBAL         -- workspaces / liveness probes. Cross-tenant by design.
#   INFRASTRUCTURE -- no application table at all (SELECT 1 health checks).
#
# LINE NUMBERS ARE THE IDENTIFIER, AND THAT IS DELIBERATE.
# A stable hash of the statement would survive refactors, but it would also let a statement be
# EDITED in place without review. Line numbers make any movement or edit surface as drift; the
# cost is a one-line inventory update when code shifts, which is the intended prompt to re-read
# the statement. The gate names the exact file:line in its failure output.
#
# TO REGISTER A NEW SITE: prefer the ORM. If raw SQL is genuinely required, give any
# tenant-scoped statement an explicit workspace predicate, then add its line below with a
# classification and a one-line reason.

