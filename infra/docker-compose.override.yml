# Dev overrides -- auto-merged by `docker compose up` (do NOT use in production).
# Restores hot-reload and code bind mounts so local DX is identical to before the
# Phase 1 image hardening. Production runs the base file only:
#   docker compose -f docker-compose.yml up -d
services:
  api:
    # Single-worker hot-reload for local iteration (base image default is
    # multi-worker, no reload).
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    # Direct host access to the API (http://localhost:8000, /docs) for local iteration.
    # This publication lives HERE rather than in the base file: compose APPENDS `ports`
    # across `-f` files instead of replacing them, so a base publication could not be
    # withdrawn by the production overlay and would leave :8000 exposed on every
    # interface in production -- which would make any non-zero TRUSTED_PROXY_COUNT
    # attacker-controlled. A bare `docker compose up` auto-merges this file, so dev keeps
    # the port; explicit `-f docker-compose.yml -f docker-compose.prod.yml` does not.
    ports:
      - "8000:8000"
    volumes:
      - ../apps/api:/srv/apps/api
      - ../db:/srv/db

  worker:
    volumes:
      - ../apps/api:/srv/apps/api

  beat:
    volumes:
      - ../apps/api:/srv/apps/api
