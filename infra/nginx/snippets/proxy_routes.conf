# Shared upstream routing, included by BOTH the plaintext (dev) and TLS (production)
# server blocks so the two can never drift apart. F-01 introduced the split; before it
# there was exactly one `server {}` on :80 and this content lived inline.
#
# The API mounts its routers under api_v1_prefix = "/api/v1" but serves /health, /ready,
# /docs and /openapi.json at the ROOT of the same app. Those two families need opposite
# rewriting, which is why there are two locations rather than one:
#
#   /api/v1/...  -> proxy_pass WITHOUT a trailing slash, so nginx forwards the URI
#                   untouched and the app sees /api/v1/... exactly as mounted.
#   /api/...     -> proxy_pass WITH a trailing slash, so /api/ is replaced by / and
#                   /api/health, /api/docs, /api/openapi.json reach the root routes.
#
# nginx selects the LONGEST matching prefix, so /api/v1/ always wins over /api/ and the
# ordering below is documentation, not control flow. Previously only the second block
# existed, so every /api/v1/x arrived as /v1/x and returned 404 -- no browser API call
# could succeed through the proxy.
#
# X-Forwarded-For appends EXACTLY ONE entry here, which is what TRUSTED_PROXY_COUNT=1 in
# docker-compose.prod.yml counts. X-Forwarded-Proto is $scheme (not a literal), so the app
# sees "https" through the TLS server and "http" through the dev one -- never a lie.
location /api/v1/ {
    proxy_pass http://api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/ {
    proxy_pass http://api_upstream/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    proxy_pass http://web_upstream/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Next.js dev/HMR and any future WebSocket route need the upgrade handshake forwarded;
    # $connection_upgrade (mapped in nginx.conf) is "close" for ordinary requests.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
