worker_processes auto;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 25m;

    upstream web_upstream {
        server web:3000;
    }

    upstream api_upstream {
        server api:8000;
    }

    server {
        listen 80;

        # The API mounts its routers under api_v1_prefix = "/api/v1" but serves /health,
        # /ready, /docs and /openapi.json at the ROOT of the same app. Those two families need
        # opposite rewriting, which is why there are two locations rather than one:
        #
        #   /api/v1/...  -> proxy_pass WITHOUT a trailing slash, so nginx forwards the URI
        #                   untouched and the app sees /api/v1/... exactly as mounted.
        #   /api/...     -> proxy_pass WITH a trailing slash, so /api/ is replaced by / and
        #                   /api/health, /api/docs, /api/openapi.json reach the root routes.
        #
        # nginx selects the LONGEST matching prefix, so /api/v1/ always wins over /api/ and the
        # ordering below is documentation, not control flow. Previously only the second block
        # existed, so every /api/v1/x arrived as /v1/x and returned 404 -- no browser API call
        # could succeed through the proxy.
        location /api/v1/ {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://api_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://web_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
