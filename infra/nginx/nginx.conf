# DEVELOPMENT / base nginx configuration -- plaintext :80 only.
#
# F-01 (transport security): this file is what a bare `docker compose up` uses, where the
# stack is reached as http://localhost and TLS would mean shipping a certificate for a name
# nobody owns. PRODUCTION DOES NOT USE THIS FILE: docker-compose.prod.yml replaces the
# mount with infra/nginx/nginx.tls.conf, which terminates TLS on :443 and redirects :80.
#
# The routing itself lives in snippets/proxy_routes.conf and is included by both files, so
# the dev and production edges can never drift apart.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 25m;

    # WebSocket/HMR upgrade support -- "upgrade" when the client asked for it, else "close".
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream web_upstream {
        server web:3000;
    }

    upstream api_upstream {
        server api:8000;
    }

    server {
        listen 80;

        include /etc/nginx/snippets/proxy_routes.conf;
    }
}
