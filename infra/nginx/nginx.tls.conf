# PRODUCTION nginx configuration -- TLS termination (F-01).
#
# WHY THIS FILE EXISTS: the bundled stack previously served the whole application in
# plaintext on :80 with no TLS anywhere, while docker-compose.prod.yml set
# ENABLE_HSTS=true -- so the API advertised Strict-Transport-Security over a connection
# that had no https:// counterpart. A browser that honoured that header would then refuse
# the only working scheme. This file makes nginx the real TLS terminator so the header is
# finally TRUE, and :80 exists only to bounce clients to :443.
#
# CERTIFICATES ARE NEVER COMMITTED. They arrive as Docker Secrets (see the `nginx` service
# and the `secrets:` block in docker-compose.prod.yml), mounted read-only at
# /run/secrets/tls_cert and /run/secrets/tls_key from infra/secrets/, which .gitignore
# excludes wholesale. Use a CA-issued certificate (Let's Encrypt / your PKI) -- a
# self-signed certificate is NOT a production answer: clients cannot validate it, and
# training users to click through a warning defeats the point of TLS.
#
# IF YOU TERMINATE TLS UPSTREAM INSTEAD (ALB/CloudFront/Cloudflare/an ingress controller),
# do not use this file -- keep the plaintext nginx.conf, put that terminator in front, and
# RAISE TRUSTED_PROXY_COUNT to include it (it appends another X-Forwarded-For hop). That
# path is supported but is NOT what the bundled production stack does.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    client_max_body_size 25m;

    # WebSocket/HMR upgrade support -- "upgrade" when the client asked for it, else "close".
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream web_upstream {
        server web:3000;
    }

    upstream api_upstream {
        server api:8000;
    }

    # ---------------------------------------------------------------------------
    # :80 -- redirect only. No application content is ever served in plaintext.
    # ---------------------------------------------------------------------------
    server {
        listen 80;

        # ACME http-01 renewal must stay reachable over :80, otherwise the redirect below
        # would break certificate renewal for the very certificate this server presents.
        # Harmless when unused: the directory is simply empty.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 308 (not 301/302): preserves the METHOD and BODY, so a POST/PUT/PATCH to an API
        # endpoint over http is replayed correctly against https instead of being silently
        # downgraded to GET. No redirect loop is possible -- this server block never
        # listens on 443, and the TLS block below never redirects.
        location / {
            return 308 https://$host$request_uri;
        }
    }

    # ---------------------------------------------------------------------------
    # :443 -- the only place application traffic is served.
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;

        # TLS 1.2 + 1.3 ONLY. SSLv3/TLS1.0/TLS1.1 are disabled (POODLE/BEAST and PCI DSS).
        ssl_protocols TLSv1.2 TLSv1.3;
        # Forward-secret AEAD suites only -- ECDHE key exchange with GCM or ChaCha20-Poly1305.
        # No CBC, no RSA key transport, no 3DES. TLS 1.3 negotiates its own suites regardless.
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        # Modern guidance: let the CLIENT pick from our list, so a client that prefers
        # ChaCha20 on hardware without AES-NI is not forced onto a slower suite.
        ssl_prefer_server_ciphers off;

        ssl_session_cache shared:MBS_TLS:10m;
        ssl_session_timeout 1d;
        # Off: nginx's default ticket key is process-wide and never rotated, which breaks
        # forward secrecy for resumed sessions.
        ssl_session_tickets off;

        # HSTS is asserted HERE, on the TLS listener, in addition to the API's own
        # ENABLE_HSTS -- so the whole origin (including the Next.js frontend, which does not
        # pass through the API middleware) is covered. `always` sends it on error responses
        # too. Deliberately NO `preload` and NO includeSubDomains-with-preload submission:
        # preloading is effectively irreversible and must be an explicit operator decision.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        include /etc/nginx/snippets/proxy_routes.conf;
    }
}
