services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mbs
      POSTGRES_PASSWORD: mbs
      POSTGRES_DB: mbs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbs -d mbs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # R1a: durability. Redis backs the Celery broker + scan DLQ + rate-limit / AI-budget /
    # MFA-lockout counters + reliability freshness timestamps -- all of which were previously
    # lost on any container restart (default RDB wrote to an unmounted /data). Enable AOF
    # (append-only file, fsync every second) and persist /data on a named volume so that state
    # survives a restart. No maxmemory is set (default = no eviction), so broker/DLQ entries are
    # never evicted. Additive + reversible; no consumer behavior changes (all are idempotent /
    # fail-open, and task replay is safe via the atomic scan claim + orphan reaper).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Graceful shutdown (Phase 1.5): on `docker stop`, uvicorn (PID 1, exec form) gets
    # SIGTERM and drains in-flight HTTP requests before exit. 30s is ample for API calls.
    stop_grace_period: 30s
    # Migrations live in ../db and are applied via `docker compose exec api ...`;
    # keep this mount in both dev and prod. The application CODE is baked into the
    # image (prod) and bind-mounted only in the dev override.
    volumes:
      - ../db:/srv/db

  # DEDICATED SCAN worker (F1): consumes ONLY the heavy `scans` queue (routed via task_routes),
  # so long-running scans can never starve the control-plane tasks -- those run on
  # `worker-default`. acks_late (Celery config) re-delivers a killed worker's task.
  worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    command: ["celery", "-A", "apps.api.celery_app.worker.celery_app", "worker", "-Q", "scans", "--loglevel=info"]
    env_file:
      - ../.env
    # W1: aggregate prefork-child metrics. Celery's prefork pool runs tasks in child processes;
    # without this each child has an isolated registry and the :9100 endpoint (MainProcess) never
    # sees their counters. PROMETHEUS_MULTIPROC_DIR makes prometheus_client write per-process files
    # that metrics.py aggregates via MultiProcessCollector. The dir is a tmpfs so it EXISTS + is
    # writable (mode 1777) at startup -> no import-time crash, and starts EMPTY every run -> no
    # stale cross-restart counter files. Metrics-only; no task/pool/behavior change. Deliberately
    # NOT set on api (multiprocess is incompatible with its custom collectors) or beat (no tasks).
    environment:
      PROMETHEUS_MULTIPROC_DIR: /run/prometheus-multiproc
    volumes:
      - type: tmpfs
        target: /run/prometheus-multiproc
        tmpfs:
          mode: 01777
    # Graceful shutdown (Phase 1.5): celery is PID 1 (exec form) and gets SIGTERM =
    # WARM shutdown -- it stops prefetching and finishes the in-flight scan. This window
    # lets a running scan tool wrap up cleanly; scans that outlast it are bounded by the
    # Celery soft/hard time limits and, in the worst case (worker SIGKILLed), recovered by
    # the orphan reaper. Raise if your typical scan needs longer to drain on deploy.
    stop_grace_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # DEDICATED DEFAULT worker (F1): consumes ONLY the `default` queue -- schedules.enqueue_due,
  # scans.reap_orphans, backup.run, retention.purge. Isolated from scan load so the orphan reaper
  # and scheduler always run on time even when every scan slot on `worker` is busy. Same image /
  # env; exec form keeps celery as PID 1 for a warm SIGTERM shutdown.
  worker-default:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    command: ["celery", "-A", "apps.api.celery_app.worker.celery_app", "worker", "-Q", "default", "--loglevel=info"]
    env_file:
      - ../.env
    # W1: same prefork-metrics aggregation as `worker` (reaper/relay/schedule counters run here in
    # child processes). tmpfs-backed multiproc dir; see the `worker` service for rationale.
    environment:
      PROMETHEUS_MULTIPROC_DIR: /run/prometheus-multiproc
    stop_grace_period: 60s
    # DR-1: the scheduled backup (backup.run) writes timestamped sets under BACKUP_DIRECTORY
    # (default /srv/backups). Mount a NAMED VOLUME so backup artifacts SURVIVE container
    # recreation/redeploy (a container-local path would be wiped). In production, bind this to a
    # durable/off-host path and pair with off-site replication (DR-3).
    volumes:
      - backup_data:/srv/backups
      # W1: tmpfs-backed prometheus multiprocess dir (exists + writable at startup, empty per run).
      - type: tmpfs
        target: /run/prometheus-multiproc
        tmpfs:
          mode: 01777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery beat: emits the periodic "enqueue due schedules" tick (continuous
  # security). Reuses the worker image; the worker executes the scans it queues.
  beat:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    command: ["celery", "-A", "apps.api.celery_app.worker.celery_app", "beat", "--loglevel=info"]
    env_file:
      - ../.env
    # Beat is a stateless emitter (PID 1, exec form); SIGTERM stops it cleanly and any
    # missed tick is re-emitted next interval. A short grace is plenty (Phase 1.5).
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ../apps/web:/srv
      - web_node_modules:/srv/node_modules

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    ports:
      - "80:80"

volumes:
  postgres_data:
  minio_data:
  web_node_modules:
  # DR-1: durable storage for backup sets so they persist across worker-default recreation.
  backup_data:
  # R1a: durable Redis AOF storage so the broker/DLQ + operational counters survive a restart.
  redis_data:
