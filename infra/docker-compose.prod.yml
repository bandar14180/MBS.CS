# Production overlay. Apply explicitly (NOT auto-merged):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Demonstrates the Task 3 secrets story: production mode (startup fails fast on
# placeholder secrets), rate limiting on, and Docker Secrets delivered via the
# `<NAME>_FILE` convention that core/config.py:_resolve_file_secrets() reads. Swap
# the example secrets/hosts for real values (or a Vault-templated file) before use.
services:
  api:
    environment:
      ENVIRONMENT: production
      RATE_LIMIT_ENABLED: "true"
      ENABLE_HSTS: "true"
      # /metrics is token-gated in prod ("public" is rejected at startup).
      METRICS_MODE: token
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
      # Explicit hostnames/origins are REQUIRED in production (wildcards are rejected).
      TRUSTED_HOSTS: '["mbs.example.com"]'
      CORS_ALLOW_ORIGINS: '["https://mbs.example.com"]'
      AI_PROVIDER: openrouter
      # Secrets come from files (Docker Secrets / Vault Agent), not inline env.
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
    secrets:
      - jwt_secret_key
      - openrouter_api_key
      - s3_secret_key
      - metrics_token

  worker:
    environment:
      ENVIRONMENT: production
      AI_PROVIDER: openrouter
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
    secrets:
      - openrouter_api_key
      - s3_secret_key

secrets:
  jwt_secret_key:
    file: ./secrets/jwt_secret_key.txt
  openrouter_api_key:
    file: ./secrets/openrouter_api_key.txt
  s3_secret_key:
    file: ./secrets/s3_secret_key.txt
  metrics_token:
    file: ./secrets/metrics_token.txt
