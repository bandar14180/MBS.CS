# Production overlay. Apply explicitly (NOT auto-merged):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Demonstrates the Task 3 secrets story: production mode (startup fails fast on
# placeholder secrets), rate limiting on, and Docker Secrets delivered via the
# `<NAME>_FILE` convention that core/config.py:_resolve_file_secrets() reads. Swap
# the example secrets/hosts for real values (or a Vault-templated file) before use.
services:
  api:
    environment:
      # Clears the base file's `unconfigured` stack-mode sentinel for the production merge.
      # Production is the case where the image's BAKED-IN code is the correct source -- there
      # is no bind mount and must never be one -- so this asserts that intent explicitly
      # rather than leaving the API unable to start. See docker-compose.yml for the full
      # rationale; the sentinel exists to catch an INCOMPLETE -f list, and the production -f
      # list names this file, so production is unaffected either way.
      MBS_STACK_MODE: production
      ENVIRONMENT: production
      RATE_LIMIT_ENABLED: "true"
      ENABLE_HSTS: "true"
      # F-08: the refresh token is an HttpOnly cookie carrying a 7-day credential. Secure is
      # mandatory in production (validate_production refuses to start without it) so the cookie
      # can never travel over plaintext http; production terminates TLS at nginx (F-01).
      REFRESH_COOKIE_SECURE: "true"
      # /metrics is token-gated in prod ("public" is rejected at startup).
      METRICS_MODE: token
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
      # Explicit hostnames/origins are REQUIRED in production (wildcards are rejected).
      TRUSTED_HOSTS: '["mbs.example.com"]'
      CORS_ALLOW_ORIGINS: '["https://mbs.example.com"]'
      # Rate-limit IDENTITY. The API REFUSES TO START in production unless this is declared
      # (core/config.py::validate_production) -- there is no safe default to inherit, so the
      # value must be a decision. It is the number of proxies in front of the API that APPEND
      # to X-Forwarded-For; the caller's own hop is then read as the Nth entry from the right.
      #
      # "1" matches THIS stack exactly: the only externally reachable entrypoint is the bundled
      # nginx on :80, whose `proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for`
      # appends precisely one entry. The API itself is published on loopback only (see `ports`
      # below), so no client can bypass nginx and forge the header.
      #
      # RECOUNT THIS FOR YOUR TOPOLOGY. Anything else that appends in front of nginx -- a load
      # balancer, a CDN, a TLS terminator -- is another hop, making the correct value 2 or more.
      # Too low collapses every anonymous client into one rate-limit bucket; too high reads
      # caller-supplied entries and lets anyone mint a fresh bucket per request. Determine it
      # empirically (docs/runbooks/deployment.md), never by guessing.
      #
      # CHANGE IT HERE, NOT IN `.env`: this `environment:` mapping overrides the base file's
      # `env_file: ../.env`, so a value set in .env is silently ignored for this service.
      TRUSTED_PROXY_COUNT: "1"
      AI_PROVIDER: openrouter
      # F-06: a metered provider in production MUST carry a spend cap -- validate_production()
      # refuses to start otherwise. RATE_LIMIT_AI bounds request RATE, never COST, so without
      # these two a runaway agent loop or an abusive tenant bills without limit. BOTH are
      # required: enforcement without a positive cap is inert. Tune the figure to your budget.
      AI_BUDGET_ENFORCE: "true"
      AI_DAILY_BUDGET_USD: "25"
      # Secrets come from files (Docker Secrets / Vault Agent), not inline env. The base file
      # loads `env_file: ../.env` into this service and a compose overlay CANNOT unset an
      # env_file-sourced variable -- so these files must WIN over whatever .env supplies.
      # core/config.py::_resolve_file_secrets() enforces exactly that precedence (B4).
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret_key
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      # B2: object-storage credentials -- BOTH halves, so neither falls back to `minioadmin`.
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      # B2: the DSN carries the application role's password, so it is a secret. Point it at a
      # LEAST-PRIVILEGED, non-root MySQL user -- unlike the pre-cutover Postgres/RLS design,
      # there is no database-role privilege that bypasses workspace isolation any more (see
      # apps/api/core/tenancy.py), but a least-privileged role is still good practice: it
      # should be able to read/write application tables and nothing more (no GRANT, no
      # SUPER, no access to other schemas). See docs/runbooks/deployment.md.
      DATABASE_URL_FILE: /run/secrets/database_url
      # B3: Redis now requires a password, so the URL carries it and is likewise a secret
      # (redis://:<password>@redis:6379/0). Broker, DLQ, rate-limit / AI-budget / MFA-lockout
      # counters all use this one URL, so authentication is uniform across every consumer.
      REDIS_URL_FILE: /run/secrets/redis_url
    # LOOPBACK ONLY -- never publish the API on a routable interface in production. External
    # traffic must arrive through nginx (:80), because TRUSTED_PROXY_COUNT above trusts exactly
    # one appended X-Forwarded-For hop; a client that could reach :8000 directly would supply
    # the entire header and forge its own rate-limit bucket at will. This binding exists only
    # for host-local operations (`curl http://127.0.0.1:8000/ready`), mirroring how Prometheus
    # and Alertmanager are published below. The base file publishes no host port at all, so
    # this is the only api publication in the production merge.
    ports:
      - "127.0.0.1:8000:8000"
    secrets:
      - jwt_secret_key
      - openrouter_api_key
      - s3_access_key
      - s3_secret_key
      - metrics_token
      - database_url
      - redis_url

  # MBS.SC -- SCANNER EXECUTION PLANE.
  #
  # This block used to grant the scan worker "the same credentials as the API" (its own
  # former comment). That meant the process executing untrusted scanner binaries against
  # customer infrastructure held the database DSN, the Redis URL, the MinIO credentials and
  # the OpenRouter key -- so a single scanner RCE yielded every tenant's data at once.
  #
  # ALL of those are now withheld. The worker reaches the control plane ONLY through the
  # scanner-manager (mbs-dispatch), which authorizes every request against the worker's own
  # identity. What it keeps is exactly what it needs to authenticate and to scan.
  #
  # The base file also switches this service off `env_file: ../.env` onto `../.env.scanner`,
  # which is load-bearing: compose CANNOT unset an env_file-sourced variable from an
  # overlay, so simply omitting the *_FILE entries here would still leave .env's values in
  # the container. Withholding requires not loading the file at all.
  worker:
    environment:
      ENVIRONMENT: production
      # Refuses to start if a control-plane credential is present (startup_security).
      SCANNER_EXECUTION_PLANE: "true"
      SCANNER_MANAGER_URL: http://scanner-manager:8100
      # The worker's OWN credential, delivered as a file (Docker secret / Vault) exactly
      # like every other secret in this stack -- core/config.py resolves *_FILE with the
      # file winning over any inherited value.
      SCANNER_WORKER_TOKEN_FILE: /run/secrets/scanner_worker_token
      # Identity. Must match the registered `scanner_workers` row; the manager authorizes
      # every request against THAT row, so a mismatch simply fails closed.
      SCANNER_WORKER_ID: ${SCANNER_WORKER_ID:-worker-public-1}
      SCANNER_POOL_ID: public-default
      # NO DATABASE_URL / REDIS_URL / S3_* / JWT_SECRET_KEY / OPENROUTER_API_KEY.
      # If you find yourself adding one back, the right fix is almost certainly a new
      # narrowly-scoped manager endpoint instead.
    secrets:
      # The worker's OWN bootstrap credential, scoped to this worker id alone. Presenting
      # it authorizes nothing beyond this worker's own pool/site.
      - scanner_worker_token
    # MBS.SC Phase 14 -- runtime hardening on the host that runs untrusted tool binaries.
    #
    # cap_drop ALL: a scanner needs no Linux capability for the PUBLIC pool. Note that this
    # deliberately removes CAP_NET_RAW, which nmap uses for SYN scanning -- nmap falls back
    # to TCP connect scans without it. That is an accepted, explicit trade for the public
    # pool; a deployment that genuinely needs SYN scans should add CAP_NET_RAW back HERE,
    # alone, rather than dropping this block.
    cap_drop:
      - ALL
    security_opt:
      # Blocks setuid/setgid escalation inside the container -- a compromised tool cannot
      # gain privileges it was not started with.
      - no-new-privileges:true
    read_only: true
    # read_only makes the root filesystem immutable, so the few genuinely-writable paths
    # are explicit tmpfs mounts. A scanner that is compromised cannot persist anything
    # across a restart, and cannot rewrite its own tooling.
    tmpfs:
      # /run/prometheus-multiproc is NOT listed here: the base file already provides it as
      # a tmpfs `volumes:` entry (W1, for prefork metric aggregation), and declaring the
      # same target in both `volumes:` and `tmpfs:` is a hard compose error --
      # "target /run/prometheus-multiproc already mounted". One tmpfs, declared once.
      - /tmp:rw,noexec,nosuid,size=2g
    user: "10001:10001"

  # MBS.SC -- the control-plane boundary. This is the service that DOES hold the
  # credentials the worker gave up, because it is the one performing validated persistence
  # on the worker's behalf. It is not reachable from outside the compose network.
  scanner-manager:
    environment:
      ENVIRONMENT: production
      # No AI credentials: the manager persists and authorizes; it never calls a model.
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
    secrets:
      - s3_access_key
      - s3_secret_key
      - database_url
      - redis_url
    # MBS.SC P8-D -- runtime emergency kill switch. Same mount as the base file; repeated
    # here because the production service overrides nothing else about volumes and a compose
    # overlay must restate a list to be sure of it.
    #
    # Deliberately NOT `infra/secrets/`: the sentinel is an OPERATIONAL control, not a
    # credential, and filing it with the secrets would put an on-call toggle under
    # secret-handling rules (rotation, backup, restricted access) that make an emergency
    # slower to use. `:ro`, so the manager cannot write its own kill switch even though it
    # can read it.
    volumes:
      - ./runtime:/run/mbs:ro
    # The manager holds real credentials, so it is hardened too -- it is the component an
    # attacker would pivot to next after the worker.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m

  # F1: the dedicated default-queue worker needs the same production config -- backup.run and
  # retention.purge touch object storage (s3_secret_key), and all tasks run in production mode.
  # DR-1/DR-2: backups are ENABLED here and ENCRYPTED at rest (key via Docker Secret). The
  # backup_data named volume (base compose) persists sets across recreation; bind it to a
  # durable/off-host path in a real deployment and enable off-site replication (DR-3) via env.
  worker-default:
    environment:
      ENVIRONMENT: production
      AI_PROVIDER: openrouter
      # F-06: a metered provider in production MUST carry a spend cap -- validate_production()
      # refuses to start otherwise. RATE_LIMIT_AI bounds request RATE, never COST, so without
      # these two a runaway agent loop or an abusive tenant bills without limit. BOTH are
      # required: enforcement without a positive cap is inert. Tune the figure to your budget.
      AI_BUDGET_ENFORCE: "true"
      AI_DAILY_BUDGET_USD: "25"
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      # Same credential set as `worker`: this one runs the reaper, relay, scheduler, backup and
      # retention tasks, all of which touch the database, object storage and the broker.
      S3_ACCESS_KEY_FILE: /run/secrets/s3_access_key
      S3_SECRET_KEY_FILE: /run/secrets/s3_secret_key
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      BACKUP_ENABLED: "true"
      BACKUP_ENCRYPTION_ENABLED: "true"
      BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup_encryption_key
      # Retention P1 Stage 1: schedule the purge but run it PLAN-ONLY (dry-run). RETENTION_DRY_RUN
      # stays "true" here -- the task meters what it WOULD delete and touches NO data. Flip to
      # "false" only after validating a dry-run cycle + taking a DR backup (see
      # docs/runbooks/retention.md). worker-default executes retention.purge.
      RETENTION_ENABLED: "true"
      RETENTION_DRY_RUN: "true"
    secrets:
      - openrouter_api_key
      - s3_access_key
      - s3_secret_key
      - backup_encryption_key
      - database_url
      - redis_url

  # Beat must also see BACKUP_ENABLED / RETENTION_ENABLED so it registers those beat entries
  # (worker.py builds the schedule from settings at import time). It only emits the ticks; the
  # backup + retention tasks run on worker-default. RETENTION_DRY_RUN stays "true" (plan-only).
  beat:
    environment:
      ENVIRONMENT: production
      BACKUP_ENABLED: "true"
      RETENTION_ENABLED: "true"
      RETENTION_DRY_RUN: "true"
      # B3: beat publishes every tick onto the broker, so it needs the authenticated URL too --
      # without it the scheduler cannot connect and all periodic work (reaper, relay, backup,
      # retention, beat-liveness heartbeat) stops silently.
      REDIS_URL_FILE: /run/secrets/redis_url
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - redis_url
      - database_url

  # B3: AUTHENTICATED REDIS. The base file runs redis-server with no password at all, which is
  # only tenable because production no longer publishes 6379 (B1) -- defence in depth requires
  # both. Redis backs the Celery broker, the DLQ and the rate-limit / AI-budget / MFA-lockout
  # counters, so unauthenticated access means task injection and tampering with those controls.
  #
  # The password is written into a config file rather than passed as `--requirepass <value>` so
  # it never appears in the container's process arguments. `--appendonly/--appendfsync` stay on
  # the command line and still win over the generated file, preserving the R1a durability
  # guarantee. `exec` keeps redis-server as PID 1 so SIGTERM reaches it directly.
  #
  # PRIVILEGE DROP: the config is generated as ROOT and then handed to the image's OWN entrypoint
  # with $1 = "redis-server", which is the condition under which docker-entrypoint.sh chowns
  # /data and re-execs via setpriv as the unprivileged `redis` user. Overriding `command:` alone
  # left $1 = "sh", silently skipping BOTH -- the server ran as root and wrote root-owned 0600
  # AOF files that a later non-root start could not read.
  #
  # `chown redis:redis /tmp/redis.conf` is REQUIRED, not cosmetic: umask 077 as root leaves the
  # file root-only, and the dropped process must still read it. The SECRET is read while we are
  # root, so operators can keep `chmod 600` on infra/secrets/*.txt -- which is also why
  # `user: redis` was rejected: it would run the command and the healthcheck as uid 999, unable
  # to read a 0600 secret, and would skip the /data chown entirely.
  #
  # `command: []` stops the base file's `redis-server ...` list being appended to the inline
  # script as stray positional arguments.
  redis:
    entrypoint:
      - sh
      - -c
      - >-
        set -e;
        umask 077;
        printf 'requirepass %s\n' "$$(cat /run/secrets/redis_password)" > /tmp/redis.conf;
        chown redis:redis /tmp/redis.conf;
        exec /usr/local/bin/docker-entrypoint.sh redis-server /tmp/redis.conf
        --appendonly yes --appendfsync everysec
    command: []
    # The base healthcheck (`redis-cli ping`) returns NOAUTH once a password is set, which would
    # hold the service permanently unhealthy and block every `depends_on: service_healthy`.
    # REDISCLI_AUTH authenticates without placing the password in argv.
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    secrets:
      - redis_password

  # B2: MySQL credentials from a Docker Secret instead of the base file's literal `mbs`.
  # Setting MYSQL_ROOT_PASSWORD/MYSQL_PASSWORD to null UNSETS the base value (verified: a null
  # `environment` key removes a base literal), so only the *_FILE variants remain and the
  # image reads the secrets. MYSQL_ROOT_PASSWORD is the instance root credential and is
  # deliberately NOT what the application connects with -- DATABASE_URL (above) points at the
  # least-privileged `mbs` application user instead, whose own password is set here too.
  #
  # !! ROTATION IS NOT AUTOMATIC !! The official mysql image only applies MYSQL_USER/
  # MYSQL_PASSWORD/MYSQL_ROOT_PASSWORD on an EMPTY data directory (first start), so on an
  # existing mysql_data volume this changes nothing about stored passwords. Rotating a live
  # database requires an explicit `ALTER USER` -- see docs/runbooks/deployment.md.
  mysql:
    environment:
      MYSQL_ROOT_PASSWORD:
      MYSQL_PASSWORD:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    secrets:
      - mysql_root_password
      - mysql_password

  # B2: MinIO root credentials from Docker Secrets instead of `minioadmin`/`minioadmin`. Same
  # null-unset mechanism as mysql. Like mysql, these apply at FIRST START; an existing
  # minio_data volume keeps its current root credentials until rotated explicitly.
  minio:
    environment:
      MINIO_ROOT_USER:
      MINIO_ROOT_PASSWORD:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password

  # Email alerts (E1..E5). Default OFF -- flip EMAIL_ENABLED=true and fill SMTP_* to turn on.
  # The email delivery task runs on worker-default; the password is a Docker Secret (*_FILE).
  # worker (scan queue) does not send email, but shares config for the DLQ-failure alert path.
  # Example (commented -- provide real values before enabling):
  #   EMAIL_ENABLED: "true"
  #   EMAIL_PROVIDER: smtp
  #   SMTP_HOST: smtp.example.com
  #   SMTP_PORT: "587"
  #   SMTP_USERNAME: alerts@example.com
  #   SMTP_PASSWORD_FILE: /run/secrets/smtp_password
  #   EMAIL_FROM_ADDRESS: alerts@example.com
  #   EMAIL_ADMIN_RECIPIENTS: '["ops@example.com"]'

  # Production monitoring (Phase 4.2). Scrapes api:8000/metrics (x-metrics-token read from the
  # mounted metrics_token secret) and worker:9100 over the internal compose network. Config in
  # ./prometheus/. Published to LOCALHOST ONLY -- never exposed publicly.
  prometheus:
    # AUDIT-005: pinned by IMMUTABLE DIGEST -- see the rationale in docker-compose.yml.
    # Tag kept in the comment for readability; the digest is what is deployed.
    # prom/prometheus:v2.54.1
    image: prom/prometheus@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    # MBS.SC PHASE 8 (P8-C -- Blocker B). Prometheus declared NO networks, so compose put it
    # on `default` -- a network none of its targets are on. Verified against compose's own
    # resolved config: it shared zero networks with api, worker, worker-default OR
    # scanner-manager, so BOTH pre-existing scrape jobs were already dead in this overlay.
    #
    # `mbs-core` is the CONTROL plane: mysql, redis, minio, api, worker-default, beat,
    # scanner-manager. It is the minimum attachment that reaches the intended targets.
    #
    # THIS GRANTS NO EXECUTION-PLANE ACCESS, and that was verified rather than assumed. The
    # scanner-manager is the one service on both `mbs-core` and `mbs-dispatch`, but it is a
    # tunnel/API ENDPOINT, not a router: a container on `mbs-core` alone cannot route through
    # it to a dispatch-only host. Tested directly -- worker-default (mbs-core only) to the
    # scan worker's dispatch address was refused at the socket. (`/proc/sys/net/ipv4/ip_forward`
    # reads 1 in EVERY container here, including mysql and api; it is the shared Docker host
    # kernel value surfaced into each netns, not a capability granted to the manager.)
    #
    # Prometheus is deliberately NOT attached to mbs-dispatch, mbs-scan-egress, or any
    # mbs-site-<slug> network. The private workers stay unaware it exists.
    networks:
      - mbs-core
    secrets:
      - metrics_token
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
      - alertmanager

  # R4: alert delivery. Alertmanager receives fired alerts from Prometheus and emails them using
  # the SAME smtp_password secret as the app's E-series email (config in ./alertmanager/). Swap the
  # placeholder smarthost/from/to in alertmanager.yml and provide ./secrets/smtp_password.txt before
  # use. Published to LOCALHOST ONLY -- never exposed publicly.
  alertmanager:
    # AUDIT-005: pinned by IMMUTABLE DIGEST -- see the rationale in docker-compose.yml.
    # Tag kept in the comment for readability; the digest is what is deployed.
    # prom/alertmanager:v0.27.0
    image: prom/alertmanager@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    secrets:
      - smtp_password
    ports:
      - "127.0.0.1:9093:9093"

  # F-01 (TRANSPORT SECURITY): nginx terminates TLS in production.
  #
  # Before this block the production overlay defined every service EXCEPT nginx, so the
  # production merge inherited the base file's plaintext `80:80` and the entire application
  # -- login, JWTs, scan evidence, reports -- crossed the network in cleartext, while
  # ENABLE_HSTS=true above advertised a TLS guarantee that did not exist.
  #
  # `ports` are APPENDED across -f files and can never be withdrawn by an overlay, so the
  # base file's :80 necessarily remains. That is fine and intended HERE: nginx.tls.conf
  # serves nothing on :80 but a 308 to https:// (plus the ACME challenge path), so the
  # inherited publication becomes the redirect listener rather than an insecure entrypoint.
  # PRODUCTION WEB.
  #
  # THE BUG THIS CLOSES. The dev stack's `target: builder`, `command: ["npm","run","dev"]` and
  # `../apps/web:/srv` bind-mount used to live in the SHARED docker-compose.yml. The production
  # merge (`-f docker-compose.yml -f docker-compose.prod.yml`) includes that shared file, so
  # production inherited all three: the effective production web service ran the Next.js
  # DEVELOPMENT server against a read-write host source mount, with NODE_ENV unset. Verified on
  # the running stack -- process tree `npm run dev` -> `next dev` -> `next-server`, and GET
  # /login returned HTTP 500 (MODULE_NOT_FOUND from the dev bundler's half-written .next cache).
  #
  # THE FIX IS STRUCTURAL, NOT A COUNTER-OVERRIDE. Those dev-only settings now live in
  # docker-compose.override.yml, which is auto-merged for a bare `docker compose up` (dev) and
  # EXCLUDED from the production -f list. Production therefore inherits nothing to undo:
  # infra/docker/Dockerfile.web's final `runtime` stage runs `next start` over a real
  # `npm run build`, with production dependencies only and no sources.
  #
  # Deliberately no `!reset` here: Compose understands that tag, but this file is also parsed by
  # the deployment tests with plain PyYAML, which cannot construct an unknown tag. Removing the
  # inheritance is both safer and more portable than cancelling it.
  web:
    environment:
      # Next.js selects production behaviour from NODE_ENV. `next start` sets it itself, but
      # declaring it makes the container's mode explicit and correct for any child process.
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # F-08 (unchanged): EMPTY = the browser calls the API SAME-ORIGIN through nginx, which is
      # what makes the refresh cookie's SameSite=strict workable and is itself the CSRF control
      # for the cookie-authenticated /auth routes. Restated here because this `environment:`
      # mapping merges with the base file's -- keeping it visible prevents a future edit from
      # silently dropping it.
      NEXT_PUBLIC_API_URL: ""
      API_INTERNAL_URL: http://api:8000
    # No `ports:` -- deliberately. nginx proxies `/` to `web:3000` in-network, so the app is
    # reached only through the single public entrypoint. Publishing 3000 would bypass nginx and
    # its TLS/security headers entirely. Host access lives in docker-compose.override.yml (dev).

  nginx:
    # Replaces the base file's plaintext config with the TLS one. Same mount PATH, different
    # SOURCE -- compose merges `volumes` by container path, so this substitutes rather than
    # appends, and the plaintext server block is simply not present in production.
    volumes:
      - ./nginx/nginx.tls.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - certbot_www:/var/www/certbot
    ports:
      - "443:443"
    secrets:
      - tls_cert
      - tls_key
    # FAIL CLOSED. Without this, a missing/empty certificate file makes nginx exit with a
    # generic SSL error under `restart: unless-stopped`, i.e. a crash loop whose cause is
    # buried -- and an operator's temptation is then to "fix" it by reverting to the
    # plaintext config, silently reopening F-01. This refuses to start with a message that
    # names the actual problem, and never falls back to serving plaintext.
    entrypoint:
      - sh
      - -c
      - >-
        set -e;
        for f in /run/secrets/tls_cert /run/secrets/tls_key; do
          if [ ! -s "$$f" ]; then
            echo "FATAL: $$f is missing or empty. Production nginx terminates TLS and refuses to serve plaintext. Provide infra/secrets/tls_cert.pem (full chain) and infra/secrets/tls_key.pem from a real CA, or -- if TLS is terminated upstream -- use the plaintext nginx.conf and raise TRUSTED_PROXY_COUNT for that extra hop." >&2;
            exit 1;
          fi;
        done;
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  prometheus_data:
  # R4: durable Alertmanager state (silences, notification log) across recreation.
  alertmanager_data:
  # F-01: ACME http-01 webroot, shared between nginx (serves the challenge over :80)
  # and whatever renewal client writes into it. Empty until a renewal runs.
  certbot_www:

# Every file below lives in infra/secrets/, which is gitignored -- generate them on the host
# before the first `up` and never commit them. See docs/runbooks/deployment.md.
secrets:
  # MBS.SC: the scanner execution plane's ONLY credential. Scoped to one worker id; the
  # manager authorizes every request against that worker's own pool/site binding, so
  # holding this grants nothing beyond that one worker's authorized work. Rotate by
  # registering a new worker and revoking the old row (revocation is control-plane side,
  # so it does not require reaching the scanner host).
  scanner_worker_token:
    file: ./secrets/scanner_worker_token.txt
  jwt_secret_key:
    file: ./secrets/jwt_secret_key.txt
  openrouter_api_key:
    file: ./secrets/openrouter_api_key.txt
  s3_secret_key:
    file: ./secrets/s3_secret_key.txt
  metrics_token:
    file: ./secrets/metrics_token.txt
  # B2: object-storage access key (paired with s3_secret_key above).
  s3_access_key:
    file: ./secrets/s3_access_key.txt
  # B2: full DSN for the least-privileged application role, e.g.
  #   mysql+aiomysql://mbs:<password>@mysql:3306/mbs
  database_url:
    file: ./secrets/database_url.txt
  # B2: MySQL root password, consumed by the mysql image at FIRST START only.
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  # B2: the `mbs` application user's password -- must match the credential embedded in
  # database_url above (two views of one credential, same as redis_password/redis_url).
  mysql_password:
    file: ./secrets/mysql_password.txt
  # B2: MinIO root credentials, consumed by the minio image at FIRST START only.
  minio_root_user:
    file: ./secrets/minio_root_user.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt
  # B3: Redis password. redis_url must embed this SAME value -- they are two views of one
  # credential and drift between them breaks every broker/cache consumer at once.
  redis_password:
    file: ./secrets/redis_password.txt
  redis_url:
    file: ./secrets/redis_url.txt
  # DR-2: master key for AES-256-GCM backup encryption at rest.
  backup_encryption_key:
    file: ./secrets/backup_encryption_key.txt
  # E1 / R4: SMTP password shared by the app's email tasks and Alertmanager alert delivery.
  smtp_password:
    file: ./secrets/smtp_password.txt
  # F-01: TLS material for the production nginx listener. Like every other entry here these
  # live in infra/secrets/ (gitignored) and are NEVER committed.
  #   tls_cert.pem -- the FULL CHAIN (leaf + intermediates), PEM. A leaf-only file makes
  #                   clients that lack the intermediate fail to validate.
  #   tls_key.pem  -- the matching PRIVATE KEY, PEM, unencrypted (nginx starts
  #                   non-interactively and cannot prompt for a passphrase). Keep it 0600
  #                   and owned by root on the host.
  # Obtain them from a real CA (Let's Encrypt or your internal PKI). A self-signed pair is
  # not a production answer -- see the header of infra/nginx/nginx.tls.conf.
  tls_cert:
    file: ./secrets/tls_cert.pem
  tls_key:
    file: ./secrets/tls_key.pem
