# MBS.SC production monitoring -- Prometheus scrape + alerting (Phase 4.2).
# Additive and secret-free: scrapes the API and worker metrics endpoints over the internal
# compose network. The API metrics token is NEVER stored here -- Prometheus reads it from the
# same mounted secret file the API uses (METRICS_MODE=token), via http_headers.files.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # API process: HTTP request/latency + API-error counters. Token-gated (METRICS_MODE=token):
  # send the x-metrics-token header, value read from the mounted secret -- no token in this file.
  - job_name: mbs-api
    metrics_path: /metrics
    http_headers:
      X-Metrics-Token:
        files:
          - /run/secrets/metrics_token
    static_configs:
      - targets: ['api:8000']

  # Worker process: scan/tool/AI/reaper/relay/schedule counters + liveness (Phase 4.1
  # endpoint). Unauthenticated but reachable only inside the compose network (never published).
  - job_name: mbs-worker
    metrics_path: /
    static_configs:
      - targets: ['worker:9100']
