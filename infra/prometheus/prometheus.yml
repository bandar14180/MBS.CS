# MBS.SC production monitoring -- Prometheus scrape + alerting (Phase 4.2).
# Additive and secret-free: scrapes the API and worker metrics endpoints over the internal
# compose network. The API metrics token is NEVER stored here -- Prometheus reads it from the
# same mounted secret file the API uses (METRICS_MODE=token), via http_headers.files.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# R4: deliver fired alerts to Alertmanager (email receiver -- see infra/alertmanager/). The
# alertmanager service runs in the production overlay only; if it is absent, Prometheus simply
# logs a delivery warning and keeps evaluating rules (non-fatal).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # API process: HTTP request/latency + API-error counters. Token-gated (METRICS_MODE=token):
  # send the x-metrics-token header, value read from the mounted secret -- no token in this file.
  - job_name: mbs-api
    metrics_path: /metrics
    http_headers:
      X-Metrics-Token:
        files:
          - /run/secrets/metrics_token
    static_configs:
      - targets: ['api:8000']

  # Worker processes: scan/tool/AI counters (on `worker`, the scans queue) + reaper/relay/
  # schedule/retention counters (on `worker-default`, the default queue) + liveness (Phase 4.1
  # endpoint). Both scraped since the F1 topology split spread these metrics across the two
  # worker processes. Unauthenticated but reachable only inside the compose network.
  - job_name: mbs-worker
    metrics_path: /
    static_configs:
      - targets: ['worker:9100', 'worker-default:9100']
