# MBS.SC Alertmanager (R4) -- delivers the Prometheus alerts (infra/prometheus/alerts.yml) to
# email. It reuses the SAME SMTP password secret as the app's E-series email (the `smtp_password`
# Docker Secret, mounted at /run/secrets/smtp_password) -- only the password is a secret. The
# non-secret per-deployment values (smarthost / from / username / to) are placeholders here; swap
# them for real values (they mirror the SMTP_* example in docker-compose.prod.yml). No secret is
# ever inlined in this file.
global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alerts@example.com'
  smtp_auth_username: 'alerts@example.com'
  smtp_auth_password_file: /run/secrets/smtp_password
  smtp_require_tls: true

# Group related alerts into one email; resend periodically while still firing. Critical alerts
# repeat more often. All routes use the single email receiver (no new channels).
route:
  receiver: email
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      repeat_interval: 1h

receivers:
  - name: email
    email_configs:
      - to: 'ops@example.com'
        send_resolved: true
