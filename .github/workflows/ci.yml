name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Unit/integration tests against a real Postgres (RLS needs it) + Redis.
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mbs
          POSTGRES_PASSWORD: mbs
          POSTGRES_DB: mbs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mbs -d mbs"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://mbs:mbs@localhost:5432/mbs
      REDIS_URL: redis://localhost:6379/0
      # Coverage gate (Phase 1.7). Configurable per-run; default 80% (also set in
      # pyproject.toml [tool.coverage.report].fail_under). Lower ONLY intentionally.
      COVERAGE_FAIL_UNDER: "80"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --no-cache-dir -r apps/api/requirements.txt
      - name: Apply migrations
        working-directory: db
        run: alembic upgrade head
      - name: Run tests with coverage gate
        # Fails the job if total coverage drops below COVERAGE_FAIL_UNDER. Emits a
        # terminal summary plus coverage.xml and htmlcov/ for the artifact upload.
        run: >-
          python -m pytest apps/api/tests
          --cov=apps/api
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          --cov-fail-under=${COVERAGE_FAIL_UNDER}
      - name: Upload coverage artifacts
        if: ${{ always() }}   # keep the report even when the gate fails, to aid triage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn

  # Dependency vulnerability audit. Non-blocking for now (a single transitive
  # advisory should surface, not wedge every PR); triage findings and pin/upgrade.
  deps-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r apps/api/requirements.txt --strict --desc

  # Scan Doctor: verify the real tool binaries run. Needs network + the worker
  # image, so it's a separate job and non-blocking (network can be flaky in CI).
  scan-doctor:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build worker image
        run: docker build -f infra/docker/Dockerfile.worker -t mbs-worker .
      - name: Run scan doctor
        run: docker run --rm mbs-worker python -m apps.api.scanner_engine.doctor
