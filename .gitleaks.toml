# Phase 1.8 -- gitleaks secret-scanning config for the CI secret-scan job.
#
# Extends the bundled ruleset and adds a project allowlist for KNOWN NON-SECRETS: local
# dev defaults (minioadmin, the mbs/mbs dev DB creds), placeholder values, and test
# fixtures. Real credentials live in .env (gitignored, never checked out in CI) or in
# Docker/Vault secrets, so they are never in the scanned tree. Keep this allowlist tight
# and justified -- do NOT add broad patterns that could mask a real leak.

title = "MBS.SC gitleaks config"

[extend]
# Start from gitleaks' built-in rules, then layer the allowlist below.
useDefault = true

[allowlist]
description = "Dev defaults, placeholders, and test fixtures -- not real secrets."

# Paths that never contain committed production secrets.
paths = [
  # ONLY the committed placeholder templates are allowlisted. A real .env / .env.scanner
  # is gitignored and must never be committed -- but if one ever IS, CI runs gitleaks with
  # --no-git over the checked-out tree, so a broad '''\.env$''' / '''\.env\..*''' rule
  # here would silently suppress the very leak this job exists to catch. Verified: with the
  # broad rules a planted sk-ant-api03-* key in .env and prod.env was NOT reported; with
  # these narrow rules it IS. Keep these anchored to .example.
  '''\.env\.example$''',
  '''\.env\.scanner\.example$''',
  '''(^|/)apps/web/\.env\.example$''',
  '''node_modules/''',
  '''\.venv/''',
  '''venv/''',
  '''apps/web/\.next/''',
  '''htmlcov/''',
  '''infra/secrets/''',            # example secret files referenced by docker-compose.prod.yml
]

# Values that are intentionally in the repo and are NOT secrets.
regexes = [
  '''minioadmin''',                                  # local MinIO dev default (docker-compose.yml)
  '''mbs:mbs@''',                                    # local Postgres dev creds in DATABASE_URL
  '''change-me-in-\.env''',                          # JWT placeholder (core/config.py)
  '''change-me-generate-a-real-secret''',            # JWT placeholder (core/config.py)
  '''correct horse battery staple''',                # test-user password fixture
  '''sk-test-dummy''',                               # dummy AI key used in tests
]

# If a candidate secret contains one of these tokens, treat it as a non-secret.
stopwords = [
  "example",
  "placeholder",
  "dummy",
  "changeme",
  "change-me",
  "minioadmin",
]

# ---------------------------------------------------------------------------
# Project-specific rules.
#
# WHY THESE EXIST: gitleaks' bundled ruleset (verified on BOTH the pinned 8.18.4 and
# 8.30.1) does NOT flag a real `sk-ant-api03-...` Anthropic key written in the bare
# `KEY=value` form a .env file uses -- the generic-api-key rule needs quoting/assignment
# context it does not find there. Since an Anthropic API key is this project's most
# sensitive runtime credential, relying on the generic rule would leave the single most
# likely leak undetected. These rules match the vendor key formats directly.
# ---------------------------------------------------------------------------

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key (sk-ant-*)"
regex = '''sk-ant-(?:api03|admin01)-[A-Za-z0-9_\-]{80,}'''
keywords = ["sk-ant-"]
[rules.allowlist]
regexes = ['''sk-ant-(?:api03|admin01)-(?:x|X|A){10,}''']  # obvious placeholder fillers

[[rules]]
id = "openai-project-key"
description = "OpenAI/OpenRouter-style project key"
regex = '''(?:sk-proj-[A-Za-z0-9_\-]{40,}|sk-or-v1-[a-f0-9]{64})'''
keywords = ["sk-proj-", "sk-or-v1-"]
